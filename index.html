<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tea House</title>
    <!-- goggle font cdn-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <!-- font awesome cnd-->
    <script
      src="https://kit.fontawesome.com/2927faa3a8.js"
      crossorigin="anonymous"
    ></script>
    <!-- tailwind cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              clifford: '#da373d',
            },
          },
        },
      };
    </script>
  </head>
  <body class="max-w-screen-xl mx-auto px-16 lg:px-28">
    <!-- banner content -->
    <header class="flex pt-20 mb-20 gap-5">
      <!-- banner text -->
      <div>
        <h1 class="text-5xl md:font-7xl font-extrabold">
          It's good <br />
          tea time at The <br />
          Tea House
        </h1>
        <br />
        <p class="text-gray-500">
          Tea and Botanical Solutions Supplier Give Optimum Satisfaction To Your
          Taste Buds.
        </p>
        <br />
        <button
          class="bg-gradient-to-r from-orange-500 to-red-500 px-5 py-3 text-white font-bold rounded-lg"
        >
          Explore more <i class="fa-solid fa-arrow-down -rotate-135"></i>
        </button>
      </div>
      <!-- banner image -->
      <div class="relative">
        <img class="w-full" src="images/banner.png" alt="" />

        <!-- image card -->
        <div
          class="flex absolute top-28 md:top-80 rounded-lg md:left-32 lg:left-28 items-center gap-2 bg-slate-100 px-2 py-5 shadow-lg"
        >
          <div>
            <i class="fa-solid fa-star text-amber-500 text-2xl"></i>
          </div>
          <div>
            <h2 class="font-bold">5.00</h2>
            <p class="text-gray-500">Trust Pilot Ratings</p>
          </div>
        </div>
      </div>
    </header>
    <main class=""></main>
    <footer></footer>
  </body>
</html>
